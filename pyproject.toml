[project]
name = "rcbld"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9.11,<3.10"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "N"]
ignore = ["E501", "N805", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
