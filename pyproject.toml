[project]
name = "rcbld"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9.10,<3.10"
dependencies = [
    "pydantic>=2.13.5",
    "shapely>=2.0.7",
]

[dependency-groups]
dev = [
    "rhinoinside>=0.8.2",
    "pytest>=8.3",
    "debugpy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "N"]
ignore = ["E501", "N805", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
extra-paths = [
    "/mnt/c/Users/Pan/.rhinocode/py39-rh8/site-stubs/rhino3d-8.30.26103.11001",
]
